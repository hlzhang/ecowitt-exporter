
services:
  ecowitt_exporter:
    image: "ecowitt-exporter:${SOURCE_REVISION:?run build-image.sh}"
    build:
      context: .
      args:
        VCS_REF: "${SOURCE_REVISION:?run build-image.sh}"
        BUILD_VERSION: "${BUILD_VERSION:?run build-image.sh}"
        DEBIAN_SNAPSHOT: "${DEBIAN_SNAPSHOT:-20261118T000000Z}"
    container_name: ecowitt_exporter
    ports:
      - "${ROCKET_PORT:-8002}:${ROCKET_PORT:-8002}"
    environment:
      - ROCKET_ADDRESS=${ROCKET_ADDRESS:-0.0.0.0}
      - ROCKET_PORT=${ROCKET_PORT:-8002}
      - ROCKET_CLI_COLORS=true
      - RUST_LOG=normal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    volumes:
      - ./data:/data
